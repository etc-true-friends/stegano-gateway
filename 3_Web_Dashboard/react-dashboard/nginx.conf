server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /audit {
        proxy_pass https://api.stegano.app/audit;
    }

    location /policy/ {
        proxy_pass https://api.stegano.app/policy/;
    }

    location /cdr/ {
        proxy_pass https://api.stegano.app/cdr/;
    }

    location = /decode {
        proxy_pass https://api.stegano.app/decode;
    }

    location = /scan {
        proxy_pass https://api.stegano.app/scan;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /dashboard/ {
        proxy_pass https://api.stegano.app/dashboard/;
    }
}