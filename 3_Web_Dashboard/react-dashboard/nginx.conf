server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /audit {
        proxy_pass http://api-gateway:8000/audit;
    }

    location /policy/ {
        proxy_pass http://api-gateway:8000/policy/;
    }

    location /cdr/ {
        proxy_pass http://api-gateway:8000/cdr/;
    }

    location = /decode {
        proxy_pass http://api-gateway:8000/decode;
    }

    location = /scan {
        proxy_pass http://api-gateway:8000/scan;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /dashboard/ {
        proxy_pass http://api-gateway:8000/dashboard/;
    }
}