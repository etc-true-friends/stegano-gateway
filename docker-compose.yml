services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stegano-api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./2_API_Gateway:/app
      - ./1_AI_Engine:/1_AI_Engine
      - ./4_Local_Workspace:/4_Local_Workspace
    environment:
      - PYTHONUNBUFFERED=1
      - S3_BUCKET=${S3_BUCKET}
    restart: always

  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: stegano-proxy
    ports:
      - "8080:8080"
      - "9091:8081"
    volumes:
      - ./2_API_Gateway:/app
      - ./4_Local_Workspace:/4_Local_Workspace
    environment:
      - API_URL=http://api-gateway:8000/scan
    command: sh -c "pip install requests && mitmweb -s /app/proxy_addon.py --listen-host 0.0.0.0 --listen-port 8080 --web-host 0.0.0.0 --web-port 8081 --set web_password=${MITMPROXY_WEB_PASSWORD}"
    depends_on:
      - api-gateway
    restart: always

  react-dashboard:
    build:
      context: ./3_Web_Dashboard/react-dashboard
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://3.88.139.96:8000}
    container_name: stegano-react-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: always

  react-mail:
    build:
      context: ./3_Web_Dashboard/react-mail
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://3.88.139.96:8000}
    container_name: stegano-react-mail
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
    restart: always
