services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stegano-api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./2_API_Gateway:/app
      - ./1_AI_Engine:/1_AI_Engine
      - ./4_Local_Workspace:/4_Local_Workspace
    environment:
      - PYTHONUNBUFFERED=1
      - S3_BUCKET=${S3_BUCKET}
    restart: always

  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: stegano-proxy
    ports:
      - "8080:8080"
      - "9091:8081"
    volumes:
      - ./2_API_Gateway:/app
      - ./4_Local_Workspace:/4_Local_Workspace
    environment:
      - API_URL=http://api-gateway:8000/scan
    command: sh -c "pip install requests && mitmweb -s /app/proxy_addon.py --listen-host 0.0.0.0 --listen-port 8080 --web-host 0.0.0.0 --web-port 8081 --set web_password=${MITMPROXY_WEB_PASSWORD}"
    depends_on:
      - api-gateway
    restart: always

  web-dashboard:
    image: python:3.10-slim
    container_name: stegano-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./3_Web_Dashboard:/app
      - ./4_Local_Workspace:/4_Local_Workspace
    working_dir: /app
    command: sh -c "pip install streamlit requests && streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      - api-gateway
    restart: always