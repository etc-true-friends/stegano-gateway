services:
  api-gateway:
    image: 537124976047.dkr.ecr.us-east-1.amazonaws.com/stegano-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stegano-api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./2_API_Gateway:/app
      - ./1_AI_Engine:/1_AI_Engine
      - ./4_Local_Workspace:/4_Local_Workspace
    environment:
      - PYTHONUNBUFFERED=1
      - S3_BUCKET=${S3_BUCKET}
      - ALETHEIA_CMD=${ALETHEIA_CMD:-python /opt/aletheia/aletheia.py spa}
      - ALETHEIA_TIMEOUT=${ALETHEIA_TIMEOUT:-8}
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /stegano-gateway
        awslogs-stream: api-gateway
    restart: always


  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: stegano-proxy
    ports:
      - "8080:8080"
      - "9091:8081"
    volumes:
      - ./2_API_Gateway:/app
      - ./4_Local_Workspace:/4_Local_Workspace
    environment:
      - API_URL=http://api-gateway:8000/scan
    command: sh -c "pip install requests && mitmweb -s /app/proxy_addon.py --listen-host 0.0.0.0 --listen-port 8080 --web-host 0.0.0.0 --web-port 8081 --set web_password=${MITMPROXY_WEB_PASSWORD}"
    depends_on:
      - api-gateway
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /stegano-gateway
        awslogs-stream: mitmproxy
    restart: always

  react-dashboard:
    image: 537124976047.dkr.ecr.us-east-1.amazonaws.com/stegano-dashboard:latest
    container_name: stegano-react-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /stegano-gateway
        awslogs-stream: react-dashboard
    restart: always

  react-mail:
    image: 537124976047.dkr.ecr.us-east-1.amazonaws.com/stegano-mail:latest
    container_name: stegano-react-mail
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /stegano-gateway
        awslogs-stream: react-mail
    restart: always
